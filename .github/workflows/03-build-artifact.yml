name: 03 Build & Push to ECR

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: tiny-health-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # AWS credentials from GitHub Secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build Docker image
      - name: Build Docker image
        run: docker build -t $IMAGE_NAME .

      # Tag image for ECR
      - name: Tag image
        run: |
          docker tag $IMAGE_NAME:latest \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/$IMAGE_NAME:latest
      - name: Create ECR repository if not exists
        run: |
         aws ecr describe-repositories --repository-names $IMAGE_NAME || \
         aws ecr create-repository --repository-name $IMAGE_NAME
      # Push image to ECR
      - name: Push image to ECR
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/$IMAGE_NAME:latest