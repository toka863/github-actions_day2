name: Deploy on PR

on:
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: tiny-health-app
  CONTAINER_NAME: tiny-health-container
  APP_PORT: "8000"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}

          script: |
            set -e

            echo "Connected to VM"

            # ===== Variables =====
            IMAGE_TAG="pr-${{ github.event.number }}"
            AWS_REGION="${{ secrets.AWS_REGION }}"
            AWS_ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
            IMAGE_NAME="tiny-health-app"

            REPO="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
            FULL_IMAGE="$REPO/$IMAGE_NAME:$IMAGE_TAG"

            echo "Repo: $REPO"
            echo "Image: $IMAGE_NAME"
            echo "Tag: $IMAGE_TAG"
            echo "Full image: $FULL_IMAGE"

            # ===== Login to ECR =====
            echo "Logging into ECR..."
            aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$REPO"

            # ===== Pull image =====
            echo "Pulling image..."
            docker pull "$FULL_IMAGE"

            # ===== Stop old container =====
            echo "Stopping old container..."
            docker rm -f "$CONTAINER_NAME" || true

            # ===== Run container =====
            echo "Running container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              -p "$APP_PORT:8000" \
              "$FULL_IMAGE"

            sleep 10

            # ===== Health check =====
            echo "Health check..."
            curl -f "http://localhost:$APP_PORT/health" || exit 1

            # ===== Cleanup (IMPORTANT: fixed bug) =====
            echo "Cleaning up old container..."
            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true

            echo "PR deployment successful ✔️"
