name: Deploy on PR
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Wait for CI to complete
        uses: lewagon/wait-on-check-action@v1.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          check-name: ci-build-push
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: PR_NUMBER,AWS_REGION,AWS_ACCOUNT_ID
          script: |
            set -e
            IMAGE_TAG=pr-$PR_NUMBER
            FULL_IMAGE=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/tiny-health-app:$IMAGE_TAG

            aws ecr get-login-password --region ${AWS_REGION} | \
              docker login --username AWS --password-stdin \
              ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

            docker pull $FULL_IMAGE
            docker rm -f tiny-health-container || true
            docker ps -q --filter "publish=8000" | xargs -r docker rm -f
            docker run -d --name tiny-health-container -p 8000:8000 $FULL_IMAGE
            sleep 5
            curl -f localhost:8000/health || exit 1
            docker stop tiny-health-container
            docker rm tiny-health-container
            echo "PR $IMAGE_TAG tested and cleaned"
        env:
          PR_NUMBER: ${{ github.event.number }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
