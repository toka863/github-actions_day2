name: 04 Deploy Workflow

on:
  workflow_run:
    workflows: ["03 Build & Push to ECR"]
    types: [completed]

env:
  IMAGE_NAME: tiny-health-app
  CONTAINER_NAME: tiny-health-container
  APP_PORT: "8000"

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull image from ECR
        run: |
          docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/$IMAGE_NAME:latest
      - name: Start container
        run: |
          docker run -d \
            --name $CONTAINER_NAME \
            -p $APP_PORT:8000 \
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/$IMAGE_NAME:latest

      - name: Smoke test deployed app
        run: |
          for i in 1 2 3 4 5; do
            curl --silent http://127.0.0.1:$APP_PORT/health && exit 0
            sleep 2
          done
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f $CONTAINER_NAME || true